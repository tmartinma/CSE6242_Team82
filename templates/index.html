<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiPredict AI | Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5; /* Indigo */
            --accent: #f43f5e;  /* Rose */
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; width: 100vw; }

        /* Floating Sidebar */
        .sidebar {
            position: absolute; top: 20px; left: 20px; width: 340px; bottom: 20px;
            background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 32px; z-index: 1000; display: flex; flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: -0.05em; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 30px; }

        /* Status Indicators */
        .status-bar { display: flex; gap: 10px; margin-bottom: 24px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; background: #cbd5e1; }
        .online { background: var(--success); box-shadow: 0 0 8px var(--success); }

        .point-box {
            padding: 16px; border-radius: 12px; background: var(--bg);
            border: 1px dashed #cbd5e1; margin-bottom: 16px; transition: 0.3s;
            font-size: 0.85rem; color: var(--text-muted);
        }
        .point-box.active-pu { border-color: var(--primary); background: #f5f3ff; color: var(--primary); border-style: solid; }
        .point-box.active-do { border-color: var(--accent); background: #fff1f2; color: var(--accent); border-style: solid; }

        button.btn-main {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }
        button.btn-main:hover { background: #4338ca; transform: translateY(-1px); }
        button.btn-main:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* Prediction Result Section */
        #prediction-view {
            margin-top: 32px; border-top: 1px solid #f1f5f9; padding-top: 32px;
            display: none; animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .eta-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .eta-large { font-size: 3.5rem; font-weight: 800; color: var(--text-main); line-height: 1; margin: 8px 0; }
        .route-info { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
        .route-info b { color: var(--text-main); }

        #map { flex-grow: 1; height: 100%; z-index: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo">TaxiPredict.ai</div>
        <div class="subtitle">Real-time NYC Trip Estimator</div>

        <div class="status-bar">
            <span><span class="status-dot online"></span> Web Server</span>
            <span><span class="status-dot online" id="engine-dot"></span> ML Engine</span>
        </div>

        <div class="point-box" id="pu_label">1. Set Pickup on Map</div>
        <div class="point-box" id="do_label">2. Set Destination on Map</div>

        <button class="btn-main" id="predict-btn" onclick="getAIResult()">Generate Estimate</button>
        <button onclick="location.reload()" style="background:none; border:none; color:#64748b; font-size:0.7rem; margin-top:20px; cursor:pointer; text-decoration:underline; width:100%;">Reset Map</button>

        <div id="prediction-view">
            <div class="eta-label">AI Estimated Duration</div>
            <div class="eta-large"><span id="eta_val">0</span><small style="font-size: 1.2rem; font-weight: 400; margin-left: 5px;">min</small></div>
            <div class="route-info" id="route_val"></div>
        </div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Map Initialization
    const map = L.map('map', { zoomControl: false }).setView([40.7128, -74.0060], 13);

    // Clean, modern light-themed tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
    }).addTo(map);

    let pickup, dropoff, routeLine, markers = [];

    // 2. Handle Clicks
    map.on('click', (e) => {
        if (!pickup) {
            pickup = e.latlng;
            addMarker(pickup, 'var(--primary)');
            const puBox = document.getElementById('pu_label');
            puBox.innerText = "Pickup Point Locked";
            puBox.classList.add('active-pu');
        } else if (!dropoff) {
            dropoff = e.latlng;
            addMarker(dropoff, 'var(--accent)');
            const doBox = document.getElementById('do_label');
            doBox.innerText = "Destination Point Locked";
            doBox.classList.add('active-do');

            // Draw route line
            routeLine = L.polyline([pickup, dropoff], {
                color: 'var(--primary)',
                weight: 4,
                dashArray: '10, 10',
                opacity: 0.6
            }).addTo(map);

            map.fitBounds(routeLine.getBounds(), { padding: [100, 100] });
            getAIResult();
        }
    });

    function addMarker(ll, color) {
        const m = L.circleMarker(ll, {
            radius: 8,
            fillColor: color,
            color: '#fff',
            weight: 3,
            fillOpacity: 1
        }).addTo(map);
        markers.push(m);
    }

    // 3. Inference Logic
    async function getAIResult() {
        if (!pickup || !dropoff) return;

        // Visual feedback
        const btn = document.getElementById('predict-btn');
        const resultView = document.getElementById('prediction-view');
        btn.disabled = true;
        btn.innerText = "Processing...";
        resultView.style.display = 'block';
        document.getElementById('eta_val').innerText = "--";

        // Calculate distance for the model
        const distanceMiles = (map.distance(pickup, dropoff) / 1609.34).toFixed(2);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    start_lat: pickup.lat,
                    start_lng: pickup.lng,
                    end_lat: dropoff.lat,
                    end_lng: dropoff.lng,
                    distance: distanceMiles
                })
            });

            const data = await response.json();

            if (data.eta) {
                document.getElementById('eta_val').innerText = Math.round(data.eta);
                document.getElementById('route_val').innerHTML = `<b>Route:</b> ${data.pickup} <br>to ${data.dropoff}`;
            } else if (data.error) {
                document.getElementById('route_val').innerText = "Error: " + data.error;
            }
        } catch (err) {
            document.getElementById('route_val').innerText = "Failed to connect to server.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate Estimate";
        }
    }
</script>

</body>
</html>
